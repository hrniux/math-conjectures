<svg width="560" height="260" viewBox="0 0 560 260" xmlns="http://www.w3.org/2000/svg" role="img">
  <rect width="560" height="260" fill="#0D1117"/>
  <polygon points="150,40 150,200 270,200" fill="#E0553B" fill-opacity="0.14" stroke="#E0553B" stroke-width="2.5" stroke-linejoin="round"/>
  <polyline points="162,188 162,200 150,200" fill="none" stroke="#E8E4DC" stroke-width="1.5"/>
  <text x="132" y="125" fill="#E8E4DC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" text-anchor="middle">b</text>
  <text x="210" y="226" fill="#E8E4DC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" text-anchor="middle">a</text>
  <text x="206" y="100" fill="#E0553B" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" text-anchor="middle" transform="rotate(-53 206 100)">c</text>
  <text x="400" y="120" fill="#E8E4DC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" text-anchor="middle">a² + b² = c²</text>
  <text x="400" y="150" fill="#8A8377" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" text-anchor="middle">3² + 4² = 5²</text>
</svg>