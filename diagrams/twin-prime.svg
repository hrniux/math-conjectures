<svg width="560" height="260" viewBox="0 0 560 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="孪生素数数轴">
  <rect width="560" height="260" fill="#0D1117"/>
  <line x1="40" y1="150" x2="520" y2="150" stroke="#E6E1D9" stroke-width="1.5"/>
  <!-- 素数刻度 -->
  <g fill="#E6E1D9">
    <circle cx="80" cy="150" r="3"/>
    <circle cx="100" cy="150" r="3"/>
    <circle cx="140" cy="150" r="3"/>
    <circle cx="180" cy="150" r="3"/>
    <circle cx="260" cy="150" r="3"/>
    <circle cx="300" cy="150" r="3"/>
    <circle cx="380" cy="150" r="3"/>
    <circle cx="420" cy="150" r="3"/>
    <circle cx="500" cy="150" r="3"/>
  </g>
  <!-- 孪生素数对（朱红括号） -->
  <g stroke="#E0553B" stroke-width="2" fill="none">
    <path d="M100 165 Q110 180 120 165"/>
    <path d="M140 165 Q150 180 160 165"/>
    <path d="M260 165 Q270 180 280 165"/>
    <path d="M380 165 Q390 180 400 165"/>
  </g>
  <g fill="#8A8377" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" text-anchor="middle">
    <text x="100" y="130">3</text>
    <text x="140" y="130">5</text>
    <text x="180" y="130">7</text>
    <text x="260" y="130">11</text>
    <text x="300" y="130">13</text>
    <text x="380" y="130">17</text>
    <text x="420" y="130">19</text>
    <text x="500" y="130">23</text>
  </g>
  <text x="280" y="215" fill="#8A8377" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" text-anchor="middle">朱红括号 = 相差 2 的素数对（孪生素数）</text>
</svg>
