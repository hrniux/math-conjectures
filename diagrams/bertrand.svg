<svg width="560" height="260" viewBox="0 0 560 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="伯特兰公设数轴">
  <rect width="560" height="260" fill="#0D1117"/>
  <line x1="100" y1="140" x2="480" y2="140" stroke="#E6E1D9" stroke-width="1.5"/>
  <line x1="100" y1="132" x2="100" y2="148" stroke="#E0553B" stroke-width="2.5"/>
  <line x1="480" y1="132" x2="480" y2="148" stroke="#E0553B" stroke-width="2.5"/>
  <text x="100" y="120" fill="#E0553B" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" text-anchor="middle">n = 10</text>
  <text x="480" y="120" fill="#E0553B" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" text-anchor="middle">2n = 20</text>
  <g fill="#E6E1D9">
    <circle cx="138" cy="140" r="5"/>
    <circle cx="214" cy="140" r="5"/>
    <circle cx="366" cy="140" r="5"/>
    <circle cx="442" cy="140" r="5"/>
  </g>
  <g fill="#8A8377" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" text-anchor="middle">
    <text x="138" y="112">11</text>
    <text x="214" y="112">13</text>
    <text x="366" y="112">17</text>
    <text x="442" y="112">19</text>
  </g>
  <text x="290" y="210" fill="#8A8377" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" text-anchor="middle">10 与 20 之间总有素数（11、13、17、19）</text>
</svg>
