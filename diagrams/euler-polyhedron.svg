<svg width="560" height="260" viewBox="0 0 560 260" xmlns="http://www.w3.org/2000/svg" role="img">
  <rect width="560" height="260" fill="#0D1117"/>
  <rect x="150" y="80" width="100" height="100" fill="none" stroke="#E8E4DC" stroke-width="2"/>
  <rect x="190" y="50" width="100" height="100" fill="none" stroke="#8A8377" stroke-width="2"/>
  <line x1="150" y1="80" x2="190" y2="50" stroke="#8A8377" stroke-width="2"/>
  <line x1="250" y1="80" x2="290" y2="50" stroke="#8A8377" stroke-width="2"/>
  <line x1="150" y1="180" x2="190" y2="150" stroke="#8A8377" stroke-width="2"/>
  <line x1="250" y1="180" x2="290" y2="150" stroke="#8A8377" stroke-width="2"/>
  <text x="400" y="110" fill="#E8E4DC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" text-anchor="middle">V = 8（顶点）</text>
  <text x="400" y="136" fill="#E8E4DC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" text-anchor="middle">E = 12（棱）</text>
  <text x="400" y="162" fill="#E8E4DC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" text-anchor="middle">F = 6（面）</text>
  <text x="400" y="194" fill="#E0553B" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" text-anchor="middle">V − E + F = 2</text>
</svg>