<svg width="560" height="260" viewBox="0 0 560 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="勒让德猜想数轴">
  <rect width="560" height="260" fill="#0D1117"/>
  <line x1="40" y1="150" x2="520" y2="150" stroke="#E6E1D9" stroke-width="1.5"/>
  <!-- n² 与 (n+1)² 刻度 -->
  <line x1="180" y1="142" x2="180" y2="158" stroke="#E0553B" stroke-width="2.5"/>
  <line x1="320" y1="142" x2="320" y2="158" stroke="#E0553B" stroke-width="2.5"/>
  <text x="180" y="130" fill="#E0553B" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" text-anchor="middle">4² = 16</text>
  <text x="320" y="130" fill="#E0553B" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" text-anchor="middle">5² = 25</text>
  <!-- 之间的素数 -->
  <g fill="#E6E1D9">
    <circle cx="225" cy="150" r="5"/>
    <circle cx="250" cy="150" r="5"/>
    <circle cx="290" cy="150" r="5"/>
  </g>
  <g fill="#8A8377" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" text-anchor="middle">
    <text x="225" y="125">17</text>
    <text x="250" y="125">19</text>
    <text x="290" y="125">23</text>
  </g>
  <text x="280" y="210" fill="#8A8377" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" text-anchor="middle">16 与 25 之间总有素数（17、19、23）</text>
</svg>
