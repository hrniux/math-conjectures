<svg width="560" height="260" viewBox="0 0 560 260" xmlns="http://www.w3.org/2000/svg" role="img">
  <rect width="560" height="260" fill="#0D1117"/>
  <text x="120" y="40" fill="#E8E4DC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" text-anchor="middle">模 7 的平方数</text>
  <text x="70" y="80" fill="#8A8377" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" text-anchor="middle">1²=1</text>
  <circle cx="70" cy="110" r="14" fill="#E0553B" fill-opacity="0.5"/>
  <text x="70" y="115" fill="#E8E4DC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" text-anchor="middle">1</text>
  <text x="145" y="80" fill="#8A8377" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" text-anchor="middle">2²=4</text>
  <circle cx="145" cy="110" r="14" fill="#E0553B" fill-opacity="0.5"/>
  <text x="145" y="115" fill="#E8E4DC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" text-anchor="middle">4</text>
  <text x="220" y="80" fill="#8A8377" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" text-anchor="middle">3²=2</text>
  <circle cx="220" cy="110" r="14" fill="#E0553B" fill-opacity="0.5"/>
  <text x="220" y="115" fill="#E8E4DC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" text-anchor="middle">2</text>
  <text x="295" y="80" fill="#8A8377" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" text-anchor="middle">4²=2</text>
  <circle cx="295" cy="110" r="14" fill="#E0553B" fill-opacity="0.5"/>
  <text x="295" y="115" fill="#E8E4DC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" text-anchor="middle">2</text>
  <text x="370" y="80" fill="#8A8377" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" text-anchor="middle">5²=4</text>
  <circle cx="370" cy="110" r="14" fill="#E0553B" fill-opacity="0.5"/>
  <text x="370" y="115" fill="#E8E4DC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" text-anchor="middle">4</text>
  <text x="445" y="80" fill="#8A8377" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" text-anchor="middle">6²=1</text>
  <circle cx="445" cy="110" r="14" fill="#E0553B" fill-opacity="0.5"/>
  <text x="445" y="115" fill="#E8E4DC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" text-anchor="middle">1</text>
  <text x="280" y="170" fill="#8A8377" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" text-anchor="middle">二次剩余：[1, 2, 4]（模 7）</text>
  <text x="280" y="200" fill="#E8E4DC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" text-anchor="middle">「p 是不是模 q 的平方」与「q 是不是模 p 的平方」互反</text>
</svg>