<svg width="560" height="260" viewBox="0 0 560 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="倍立方">
  <rect width="560" height="260" fill="#0D1117"/>
  <line x1="120" y1="100" x2="280" y2="100" stroke="#E0553B" stroke-width="4" stroke-linecap="round"/>
  <text x="200" y="80" fill="#E0553B" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" text-anchor="middle">1（可作）</text>
  <line x1="120" y1="170" x2="366" y2="170" stroke="#E6E1D9" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 5"/>
  <text x="243" y="150" fill="#E6E1D9" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" text-anchor="middle">∛2（不可作）</text>
  <text x="420" y="135" fill="#8A8377" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" text-anchor="middle">体积翻倍需边长 ∛2 倍</text>
</svg>
