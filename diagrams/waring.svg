  <text x="260" y="215" fill="#8A8377" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" text-anchor="middle">每个正整数都能写成至多 4 个平方数之和（g(2)=4）</text>
