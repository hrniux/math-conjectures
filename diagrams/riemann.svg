<svg width="560" height="260" viewBox="0 0 560 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="黎曼临界线">
  <rect width="560" height="260" fill="#0D1117"/>
  <!-- 坐标轴 -->
  <line x1="40" y1="130" x2="520" y2="130" stroke="#E6E1D9" stroke-width="1.5"/>
  <line x1="280" y1="20" x2="280" y2="240" stroke="#E6E1D9" stroke-width="1.5"/>
  <text x="515" y="150" fill="#8A8377" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Re</text>
  <text x="292" y="30" fill="#8A8377" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Im</text>
  <!-- 临界线 Re = 1/2 -->
  <line x1="400" y1="20" x2="400" y2="240" stroke="#E0553B" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="400" y="250" fill="#E0553B" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" text-anchor="middle">Re = ½</text>
  <!-- 非平凡零点（在临界线上） -->
  <g fill="#E0553B">
    <circle cx="400" cy="70" r="4"/>
    <circle cx="400" cy="110" r="4"/>
    <circle cx="400" cy="150" r="4"/>
    <circle cx="400" cy="190" r="4"/>
  </g>
  <!-- 平凡零点（负偶数） -->
  <g fill="#8A8377">
    <circle cx="100" cy="130" r="4"/>
    <circle cx="160" cy="130" r="4"/>
  </g>
  <text x="100" y="115" fill="#8A8377" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" text-anchor="middle">−2, −4, …</text>
</svg>
