<svg width="560" height="260" viewBox="0 0 560 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="柯尼斯堡七桥图">
  <rect width="560" height="260" fill="#0D1117"/>
  <!-- 7 座桥（边） -->
  <g stroke="#8A8377" stroke-width="2">
    <line x1="150" y1="54" x2="400" y2="54"/>
    <line x1="150" y1="66" x2="400" y2="66"/>
    <line x1="144" y1="60" x2="144" y2="200"/>
    <line x1="156" y1="60" x2="156" y2="200"/>
    <line x1="150" y1="60" x2="400" y2="200"/>
    <line x1="400" y1="60" x2="400" y2="200"/>
    <line x1="150" y1="200" x2="400" y2="200"/>
  </g>
  <!-- 4 个陆地（顶点） -->
  <g fill="#0D1117" stroke="#E0553B" stroke-width="2.5">
    <circle cx="150" cy="60" r="16"/>
    <circle cx="400" cy="60" r="16"/>
    <circle cx="150" cy="200" r="16"/>
    <circle cx="400" cy="200" r="16"/>
  </g>
  <g fill="#E6E1D9" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <text x="150" y="65">A</text>
    <text x="400" y="65">B</text>
    <text x="150" y="205">C</text>
    <text x="400" y="205">D</text>
  </g>
  <text x="280" y="245" fill="#8A8377" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" text-anchor="middle">4 个顶点度数均为奇数（5、3、3、3）→ 无法一笔画</text>
</svg>
