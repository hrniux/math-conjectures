<svg width="560" height="260" viewBox="0 0 560 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="欧几里得证明">
  <rect width="560" height="260" fill="#0D1117"/>
  <text x="280" y="70" fill="#E6E1D9" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" text-anchor="middle">2 × 3 × 5 × 7 = 210</text>
  <text x="280" y="115" fill="#E6E1D9" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" text-anchor="middle">210 + 1 = 211</text>
  <text x="280" y="165" fill="#E0553B" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" text-anchor="middle">211 是素数（或其质因子是新素数）</text>
  <text x="280" y="215" fill="#8A8377" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" text-anchor="middle">∴ 素数不可能只有有限多个</text>
</svg>
